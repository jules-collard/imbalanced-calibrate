name: Linter

on:
  push:
    branches:
    - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: Install dependencies
        run: uv sync --group lint

      - name: Run linter
        run: |
          uv run black --check --diff imbcalibrate
          uv run black --check --diff examples
          uv run ruff check --output-format=full imbcalibrate
          uv run ruff check --output-format=full examples

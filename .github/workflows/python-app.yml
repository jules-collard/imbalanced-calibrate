name: Unit Tests

on:
  push:
    branches:
    - main
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            environment: "test"
          - os: ubuntu-latest
            python-version: "3.11"
            environment: "test"
          - os: ubuntu-latest
            python-version: "3.12"
            environment: "test"
          - os: ubuntu-latest
            python-version: "3.13"
            environment: "test"
          - os: ubuntu-latest
            python-version: "3.14"
            environment: "test"
          - os: windows-latest
            python-version: "3.14"
            environment: "test"
          - os: macos-latest
            python-version: "3.14"
            environment: "test"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install OpenMP runtime (macOS only)
        if: runner.os == 'macOS'
        run: |
          brew install libomp

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --group ${{ matrix.environment }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -vsl --cov=imbcalibrate --cov-report=xml imbcalibrate

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jules-collard/imbalanced-calibrate
